        <span class="slot">${esc(item.src)}</span>
      </div>
      ${item.caption ? `<figcaption>${esc(item.caption)}</figcaption>` : ""}`;
    const img = fig.querySelector("img");
    img.addEventListener("load", () => fig.classList.remove("empty"));
    img.src = item.src;
    frag.appendChild(fig);
  });
  $("tiles").appendChild(frag);
}

function renderLinks() {
  const frag = document.createDocumentFragment();
  (CONFIG.links || []).forEach((item) => {
    const path = ICONS[item.icon] || ICONS.link;
    const isMail = String(item.url).startsWith("mailto:");
    const el = document.createElement("a");
    el.className = "link";
    el.href = item.url;
    // mailto: hands off to whatever mail app the device has — Mail or Gmail on a phone,
    // the desktop default otherwise. No target=_blank: that opens a dead tab first.
    if (isMail) el.title = "Opens your email app";
    if (!isMail) {
      el.target = "_blank";
      el.rel = "noopener noreferrer";
    }
    el.innerHTML = `
      <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg></span>
      <span class="txt">
        <span class="label">${esc(item.label)}</span>
        ${item.handle ? `<span class="handle">${esc(item.handle)}</span>` : ""}
      </span>
      <span class="chev">${isMail ? MAILTO_GLYPH : CHEVRON}</span>`;
    frag.appendChild(el);
  });
  $("links").appendChild(frag);
}

/** Total visits, counted by the Worker at CONFIG.apiBase. Fire-and-forget: the
 *  page is complete without it, so any failure leaves the field hidden rather
 *  than putting an error in front of a visitor. Both pages call this, so the
 *  total counts views of either. */
async function renderVisits() {
  if (!CONFIG.apiBase) return;
  try {
    const res = await fetch(`${CONFIG.apiBase}/hit`);
    if (!res.ok) return;
    const { visits } = await res.json();
    if (typeof visits !== "number") return;
    const el = $("visits");
    el.textContent = `${visits.toLocaleString()} visits`;
    el.hidden = false;
  } catch {
    /* offline, blocked, or the Worker is down - stay quiet */
  }
}

function render() {
  $("tb-title").textContent = CONFIG.windowTitle || "Official Links";
  $("eyebrow").textContent = CONFIG.eyebrow || "";
  $("title").textContent = CONFIG.title || "";
  $("tagline").textContent = CONFIG.tagline || "";
  $("status-text").textContent = CONFIG.statusText || "Done";
  renderVisits();
  $("obj-count").textContent = `${(CONFIG.links || []).length} object(s)`;
  $("footer-text").textContent = CONFIG.footer || "";
  if (CONFIG.portfolio) {
    $("cta").hidden = false;
    $("cta-link").href = CONFIG.portfolio.href;
    $("cta-link").textContent = CONFIG.portfolio.label;
  }
  renderPortrait();
  renderLinks();
  renderGallery();
}

render();
</script>
</body>
</html>
