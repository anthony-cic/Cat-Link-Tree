<style>
/* Same Windows 98 kit as the home page — one bevel, three colours. A media kit that
   looked like a different site would undercut the thing it's selling. */
:root {
  --bg: #3a6ea5;
  --face: #c0c0c0;
  --ink: #000;
  --ink-soft: #3f3f3f;
  --ink-faint: #6b6b6b;
  --accent: #000080;
  --card: #fff;
  --bevel-lt: #fff;
  --bevel-hi: #dfdfdf;
  --bevel-md: #808080;
  --bevel-dk: #000;
  --win: Tahoma, "MS Sans Serif", Geneva, Verdana, sans-serif;
  --mono: "Courier New", monospace;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font: 13px/1.55 var(--win);
  display: flex; justify-content: center; align-items: flex-start;
  padding: 16px 12px 40px;
}
a { color: inherit; }

.window {
  width: 100%; max-width: 46rem;
  background: var(--face); padding: 3px;
  border: 2px solid;
  border-color: var(--bevel-lt) var(--bevel-dk) var(--bevel-dk) var(--bevel-lt);
  box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-md), 2px 2px 0 rgba(0,0,0,.35);
}
.titlebar {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 3px 4px 5px; margin-bottom: 2px;
  color: #fff; font-weight: 700; font-size: 12px;
  background: linear-gradient(90deg, #000080 0%, #1084d0 100%);
}
.titlebar .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titlebar b {
  width: 17px; height: 15px; display: grid; place-items: center; font-size: 10px;
  color: #000; background: var(--face);
  border: 1px solid; border-color: var(--bevel-lt) var(--bevel-dk) var(--bevel-dk) var(--bevel-lt);
  box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-md);
}
.menubar { display: flex; gap: 14px; padding: 3px 6px; margin-bottom: 2px; font-size: 12px; }
.menubar u { text-decoration: underline; }
.pane { padding: 16px; }
.statusbar { display: flex; gap: 3px; margin-top: 4px; font-size: 11px; }
.statusbar span {
  padding: 3px 6px;
  border: 1px solid; border-color: var(--bevel-md) var(--bevel-hi) var(--bevel-hi) var(--bevel-md);
}
.statusbar span:first-child { flex: 1; }
/* `hidden` loses to any explicit display, so say it again. */
.statusbar span[hidden] { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; font: 700 13px var(--win); color: #000;
  background: var(--face); cursor: pointer; text-decoration: none;
  border: 2px solid; border-color: var(--bevel-lt) var(--bevel-dk) var(--bevel-dk) var(--bevel-lt);
  box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-md);
}
.btn:active {
  border-color: var(--bevel-dk) var(--bevel-lt) var(--bevel-lt) var(--bevel-dk);
  box-shadow: inset 1px 1px 0 var(--bevel-md), inset -1px -1px 0 var(--bevel-hi);
  padding: 9px 13px 7px 15px;
}
.btn:focus-visible { outline: 2px dotted #000; outline-offset: -6px; }

/* ---------- header ---------- */
.top { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.top .portrait {
  width: 92px; height: 92px; flex: 0 0 auto; overflow: hidden;
  display: grid; place-items: center; background: var(--card);
  border: 2px solid; border-color: var(--bevel-md) var(--bevel-lt) var(--bevel-lt) var(--bevel-md);
  box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 var(--bevel-hi);
}
.top .portrait img, .top .portrait svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.top .who { flex: 1; min-width: 14rem; }
h1 { margin: 0 0 2px; font-size: 22px; }
.sub { margin: 0; color: var(--ink-soft); }
.intro { margin: 12px 0 0; max-width: 46ch; color: var(--ink-soft); }

hr.rule { margin: 18px 0; height: 2px; border: 0; border-top: 1px solid var(--bevel-md); border-bottom: 1px solid var(--bevel-hi); }

h2 {
  margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-soft);
}

/* ---------- the hero figure: one per page ----------
   Total reach is the number a brand looks for first, so it gets the only
   oversized type on the page. Proportional figures, not tabular — tabular
   digits look loose at display sizes. */
.hero {
  background: var(--card); padding: 14px 16px; margin-bottom: 12px;
  border: 2px solid; border-color: var(--bevel-md) var(--bevel-lt) var(--bevel-lt) var(--bevel-md);
  box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 var(--bevel-hi);
}
.hero .figures { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-end; }
.hero .label { font-size: 12px; color: var(--ink-soft); }
.hero .value { font-size: 48px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
/* Deliberately smaller: two numbers at 48px would compete, and following is the one a
   brand looks for first. Views supports it rather than rivalling it. */
.hero .value.second { font-size: 34px; }
.hero .foot { font-size: 11px; color: var(--ink-faint); }

/* ---------- KPI row: one tile per platform ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.tile {
  background: var(--face); padding: 12px;
  border: 2px solid; border-color: var(--bevel-lt) var(--bevel-dk) var(--bevel-dk) var(--bevel-lt);
  box-shadow: inset 1px 1px 0 var(--bevel-hi), inset -1px -1px 0 var(--bevel-md);
}
/* Identity is the glyph + the name, never the number's colour — the values stay in
   ink so they read as data rather than decoration. */
.tile .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.tile .glyph {
  width: 26px; height: 26px; flex: 0 0 auto; display: grid; place-items: center;
  background: var(--accent); color: #fff;
}
.tile .glyph svg { width: 15px; height: 15px; fill: currentColor; }
.tile .name { font-weight: 700; }
.tile .handle { font: 11px var(--mono); color: var(--ink-soft); }
.metric { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 3px 0; }
.metric .k { font-size: 12px; color: var(--ink-soft); }
.metric .v { font-size: 17px; font-weight: 700; }
.tile .note { margin: 8px 0 0; font-size: 11px; color: var(--ink-faint); }

ul.services { margin: 0; padding-left: 18px; }
ul.services li { margin-bottom: 4px; }
.prose { margin: 0; color: var(--ink-soft); max-width: 60ch; }

/* ---------- contact form ---------- */
form { background: var(--face); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
label.f { display: block; margin-bottom: 10px; font-size: 12px; }
label.f span { display: block; margin-bottom: 3px; color: var(--ink-soft); }
input, textarea, select {
  width: 100%; padding: 5px 6px; font: 13px var(--win); color: #000; background: #fff;
  border: 2px solid; border-color: var(--bevel-md) var(--bevel-lt) var(--bevel-lt) var(--bevel-md);
  box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 var(--bevel-hi);
}
textarea { resize: vertical; min-height: 110px; font-family: var(--win); }
.formfoot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.sent { font-size: 12px; color: var(--ink-soft); }
/* Honeypot. Moved off-screen rather than display:none — the better bots skip
   fields that are genuinely hidden, and the point is that they fill this one. */
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.backlink { display: inline-block; margin-top: 16px; font-size: 12px; }

footer { margin-top: 18px; text-align: center; font-size: 11px; color: var(--ink-faint); }
</style>
</head>

          <label class="f"><span>Company (optional)</span><input id="f-company" name="company" autocomplete="organization"></label>
        </div>
        <div class="row2">
          <label class="f"><span>Your email</span><input id="f-email" name="email" type="email" autocomplete="email" required></label>
          <label class="f"><span>Subject</span>
            <select id="f-subject" name="subject">
              <option>Sponsored post enquiry</option>
              <option>Brand partnership</option>
              <option>Product gifting</option>
              <option>Press / interview</option>
              <option>Something else</option>
            </select>
          </label>
        </div>
        <label class="f"><span>Message</span><textarea id="f-message" name="message" required

        <div class="formfoot">
          <button class="btn" type="submit">✉ Send email</button>
          <button class="btn" type="button" id="copy">Copy address</button>
          <span class="sent" id="sent"></span>
        </div>
      </form>
    </section>

</div>

const CAT_PLACEHOLDER = `
<svg viewBox="0 0 100 100" role="img" aria-label="Portrait placeholder">
  <rect width="100" height="100" fill="#000080" opacity=".12"/>
  <path d="M22 44 L26 20 L44 33 A44 44 0 0 1 56 33 L74 20 L78 44 Z" fill="currentColor"/>
  <circle cx="50" cy="60" r="27" fill="currentColor"/>
  <circle cx="40" cy="56" r="4.2" fill="#fff"/><circle cx="60" cy="56" r="4.2" fill="#fff"/>
  <path d="M50 66 l-4 3.5 4 3 4-3z" fill="#fff"/>
</svg>`;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/** 12_900 → "12.9K". Compact so a tile never wraps, per the stat-tile contract. */
const compact = (n) =>
  new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 }).format(n);

function renderPortrait() {
  const box = $("portrait");
  box.innerHTML = CAT_PLACEHOLDER;
  if (!CONFIG.photo) return;
  const img = new Image();
  img.alt = "Portrait";
  img.addEventListener("load", () => { box.innerHTML = ""; box.appendChild(img); });
  img.src = CONFIG.photo;
}

function renderStats() {
  const stats = CONFIG.stats || [];

  // The hero is the sum of every follower count we actually have. If none are filled
  // in, the block stays hidden rather than announcing "0".
  const total = stats.reduce((n, s) => n + (s.followers || 0), 0);
  if (total > 0) {
    $("hero").hidden = false;
    $("hero-value").textContent = compact(total);
    const across = stats.filter((s) => s.followers).map((s) => s.label).join(" · ");
    $("hero-foot").textContent = [across, CONFIG.statsAsOf && `as of ${CONFIG.statsAsOf}`]
      .filter(Boolean).join(" — ");
  }

  // Views sit beside the following count, but only once there's a number to show —
  // an empty second figure would look like something failed to load.
  const views = stats.reduce((n, s) => n + (s.totalViews || 0), 0);
  if (views > 0) {
    $("hero").hidden = false;
    $("hero-views").hidden = false;
    $("hero-views-value").textContent = compact(views);
  }

  const frag = document.createDocumentFragment();
  stats.forEach((s) => {
    const metrics = [
      ["Followers", s.followers != null ? compact(s.followers) : null],
      ["Total views", s.totalViews != null ? compact(s.totalViews) : null],
      ["Total likes", s.totalLikes != null ? compact(s.totalLikes) : null],
      ["Engagement", s.engagement || null],
    ].filter(([, v]) => v);
    if (!metrics.length && !s.note) return;   // nothing to say about this platform yet

    const el = document.createElement(s.url ? "a" : "div");
    el.className = "tile";
    if (s.url) { el.href = s.url; el.target = "_blank"; el.rel = "noopener noreferrer"; el.style.textDecoration = "none"; }
    el.innerHTML = `
      <div class="head">
        <span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[s.icon] || ICONS.link}"/></svg></span>
        <span>
          <span class="name">${esc(s.label)}</span>
          ${s.handle ? `<br><span class="handle">${esc(s.handle)}</span>` : ""}
        </span>
      </div>
      ${metrics.map(([k, v]) => `<div class="metric"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("")}
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}`;
    frag.appendChild(el);
  });
  $("tiles").appendChild(frag);
}

function renderServices() {
  const items = (CONFIG.services || []).filter(Boolean);
  if (!items.length) return;
  $("services-section").hidden = false;
  $("services").innerHTML = items.map((s) => `<li>${esc(s)}</li>`).join("");
}

/** Builds the mailto: used when there's no Worker, or when it can't be reached.
 *  Everything typed goes in the body, so the reply-to address is visible even
 *  though mailto: has no way to set one. */
function mailtoFor() {
  const f = readForm();
  const body = [
    `From: ${f.name}${f.company ? ` (${f.company})` : ""}`,
    `Reply to: ${f.email}`,
    "",
    f.message,
  ].join("\n");

  return `mailto:${CONFIG.contactEmail}` +
    `?subject=${encodeURIComponent(`[${f.subject}] ${f.name || "Website enquiry"}`)}` +
    `&body=${encodeURIComponent(body)}`;
}

function readForm() {
  return {
    name: $("f-name").value.trim(),
    company: $("f-company").value.trim(),
    email: $("f-email").value.trim(),
    subject: $("f-subject").value,
    message: $("f-message").value.trim(),
    // The honeypot. Sent as-is: the server decides what it means, not the page.
    website: $("f-website").value,
  };
}

function wireForm() {
  const form = $("form");
  const sent = $("sent");
  const submit = form.querySelector('button[type="submit"]');
  const api = CONFIG.apiBase || "";

  if (!CONFIG.contactEmail) {
    form.hidden = true;
    return;
  }

  // Without a Worker the button can only ever open a mail client, so say so.
  if (!api) submit.textContent = "✉ Compose email";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const missing = ["f-name", "f-email", "f-message"].filter((id) => !$(id).value.trim());
    if (missing.length) {
      sent.textContent = "Please fill in your name, email and a message.";
      $(missing[0]).focus();
      return;
    }

    if (!api) {
      sent.textContent = "Opening your email app…";
      window.location.href = mailtoFor();
      return;
    }

    const f = readForm();
    submit.disabled = true;
    sent.textContent = "Sending…";

    try {
      const res = await fetch(`${api}/contact`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          // Company rides along in the name so it lands in the email's From line
          // without needing a field of its own on the server.
          name: f.company ? `${f.name} (${f.company})` : f.name,
          email: f.email,
          subject: f.subject,
          message: f.message,
          website: f.website,
        }),
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        form.reset();
        sent.textContent = "Sent — thanks, we'll be in touch shortly.";
      } else {
        // The server's own wording is more specific than anything generic here
        // (rate limited, daily cap reached, a named invalid field).
        sent.textContent = data.error || "That didn't go through — please try again.";
        if (data.fallback) sent.textContent += ` (${data.fallback})`;
      }
    } catch {
      // Offline, DNS failure, a blocking extension. The message the visitor
      // typed is still in the form, so hand it to their mail client instead
      // of losing it.
      sent.textContent = "Couldn't reach the server — opening your email app instead…";
      window.location.href = mailtoFor();
    } finally {
      submit.disabled = false;
    }
  });

  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(CONFIG.contactEmail);
      sent.textContent = `Copied ${CONFIG.contactEmail}`;
    } catch {
      // Clipboard is blocked outside a secure context or without permission -
      // showing the address is a perfectly good fallback.
      sent.textContent = CONFIG.contactEmail;
    }
  });
}

/** Total visits, counted by the Worker. Deliberately fire-and-forget: the page
 *  is complete without it, so a failure leaves the field hidden rather than
 *  putting an error in the status bar. */
async function renderVisits() {
  if (!CONFIG.apiBase) return;
  try {
    const res = await fetch(`${CONFIG.apiBase}/hit`);
    if (!res.ok) return;
    const { visits } = await res.json();
    if (typeof visits !== "number") return;
    const el = $("visits");
    el.textContent = `${visits.toLocaleString()} visits`;
    el.hidden = false;
  } catch {
    /* offline, blocked, or the Worker is down - stay quiet */
  }
}

function render() {
  $("tb-title").textContent = CONFIG.windowTitle || "Media Kit";
  $("title").textContent = CONFIG.title || "";
  $("sub").textContent = CONFIG.subtitle || "";
  $("intro").textContent = CONFIG.intro || "";
  $("audience-note").textContent = CONFIG.audienceNote || "";
  $("contact-heading").textContent = CONFIG.contactHeading || "Get in touch";
  $("contact-note").textContent = CONFIG.contactNote || "";
  $("footer-text").textContent = CONFIG.footer || "";
  $("status-text").textContent = CONFIG.statsAsOf ? `Figures as of ${CONFIG.statsAsOf}` : "Ready";
  $("obj-count").textContent = `${(CONFIG.stats || []).length} platform(s)`;
  $("back").textContent = CONFIG.backLabel || "← Back to links";

  renderPortrait();
  renderStats();
  renderServices();
  wireForm();
  renderVisits();
}

render();
</script>
</body>
